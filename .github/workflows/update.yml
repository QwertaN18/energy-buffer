name: Update Electricity Schedule

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Camoufox
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libasound2 libdbus-glib-1-2
          pip install -U camoufox[geoip] beautifulsoup4
          python -m camoufox fetch

      - name: Run scraper
        run: xvfb-run -a python -u scraper.py

      - name: Commit and push schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "Update schedule.json"
          git push
