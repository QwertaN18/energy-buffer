name: Update Electricity Schedule

on:
  schedule:
    - cron: '*/15 * * * *' # Каждые 20 минут
  workflow_dispatch:       # Позволяет запускать вручную кнопкой

permissions:
  contents: write          # Разрешаем роботу сохранять schedule.json в репозиторий

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "Update schedule.json"
          git push
