name: Update Electricity Schedule

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome & DrissionPage
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install DrissionPage beautifulsoup4

      - name: Run scraper with virtual display
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python scraper.py

      - name: Commit and push schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "Update schedule.json"
          git push
