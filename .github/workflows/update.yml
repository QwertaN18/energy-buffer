name: Update Electricity Schedule

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and connect Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp xvfb
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 4
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E "ip=|warp="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Camoufox & dependencies
        run: |
          pip install -U camoufox playwright beautifulsoup4
          playwright install-deps firefox
          python -m camoufox fetch

      - name: Run scraper
        run: xvfb-run -a python -u scraper.py

      - name: Commit and push schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "Update schedule.json"
          git push
